# Key: subURL
# Values: comma separated values to replace with the link - case insenstive, whole words only
# Base URL: https://www.tirules2.com/
# Example: R_production=production -> the first "production" in a message becomes "[production](<https://www.tirules2.com/R_production>)"
# Each page is linked at most once per message, and longer terms win over shorter ones they contain.
# Leave out words too generic to be worth a link (control, cost, ships, units, planets, combat, trade, destroyed).
