on: workflow_dispatch
name: RestartPostgres
concurrency:
  group: "RestartPostgres"
jobs:
  restart:
    name: Restart Postgres
    runs-on: ubuntu-latest
    steps:
      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            whoami; id
            echo "=== passwordless sudo? ==="
            sudo -n true 2>&1 && echo "YES" || echo "NO"
            sudo -n -l 2>&1 | head -20 || true
            echo "=== restarting postgres ==="
            sudo -n systemctl restart postgresql 2>&1 && echo "restart issued" || echo "restart FAILED"
            sleep 5
            echo "=== AFTER ==="
            ss -lntp | grep 5432 || echo "nothing listening"
            pg_isready -h 172.17.0.1 -p 5432 2>&1 || true
            docker ps --format '{{.Names}}\t{{.Status}}'
